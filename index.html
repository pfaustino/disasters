<!doctype html>
<html lang="en" data-theme="hud">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>World Disasters</title>
    <script>
      try {
        if (localStorage.getItem('world-disasters-theme') === 'neobrutal') {
          document.documentElement.dataset.theme = 'neobrutal'
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="globe"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
